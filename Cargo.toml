[package]
name = "uasset-parser"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Read-only parser foundation for classic Unreal Engine asset packages"
license = "MIT"

[lib]
name = "uasset_parser"
path = "src/lib.rs"

[[bin]]
name = "uasset"
path = "src/bin/uasset.rs"

[dependencies]
lz4_flex = { version = "0.11", optional = true, default-features = false }
pdb-addr2line = { version = "0.12", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["uasset"]
uasset = []
utrace = ["dep:lz4_flex"]
utrace-symbols = ["utrace", "dep:pdb-addr2line"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
