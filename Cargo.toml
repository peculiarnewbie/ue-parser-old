[package]
name = "uasset-parser"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Read-only parser foundation for classic Unreal Engine asset packages"
license = "MIT"

[lib]
name = "uasset_parser"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "uasset"
path = "src/bin/uasset.rs"

[dependencies]
lz4_flex = { version = "0.11", optional = true, default-features = false }
pdb-addr2line = { version = "0.12", optional = true }
rustc-hash = { version = "2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = ["uasset"]
uasset = []
utrace = ["dep:lz4_flex", "dep:rustc-hash"]
utrace-symbols = ["utrace", "dep:pdb-addr2line"]
# The existing browser UI needs both package-summary and UTrace operations.
# Keep that compatibility feature, but let the published npm package compile a
# UTrace-only binding surface.
utrace-wasm = ["utrace", "dep:wasm-bindgen"]
wasm-uasset = ["uasset"]
wasm = ["utrace-wasm", "wasm-uasset"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
