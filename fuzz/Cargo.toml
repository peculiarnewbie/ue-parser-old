[package]
name = "uasset-parser-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
uasset-parser = { path = "..", features = ["utrace"] }

[[bin]]
name = "package_parse"
path = "fuzz_targets/package_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "property_stream"
path = "fuzz_targets/property_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "utrace_packets"
path = "fuzz_targets/utrace_packets.rs"
test = false
doc = false
bench = false
